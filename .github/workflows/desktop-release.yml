name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build & Release Windows App
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Prepare WebAssembly Assets
        run: npm run copy-wasm

      - name: Build Next.js Standalone
        shell: bash
        env:
          NEXT_PUBLIC_IS_ELECTRON: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0'
          SUPABASE_SECRET_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
        run: |
          if ! npm run build > build.log 2>&1; then
            echo "### Next.js Build Failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat build.log
            exit 1
          fi

      - name: Push Build Debug Log on Failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b build-debug-${{ github.run_id }}
          echo "Failure debug for run ${{ github.run_id }}" > debug-info.txt
          if [ -f build.log ]; then
            cp build.log build-captured.log
          else
            echo "No build.log file was produced" > build-captured.log
          fi
          git add debug-info.txt build-captured.log
          git commit -m "debug: capture build log for run ${{ github.run_id }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" build-debug-${{ github.run_id }}

      - name: Assemble Standalone Static Assets
        run: node scripts/copy-standalone.cjs

      - name: Compile Electron Main Process
        run: npm run electron:compile

      - name: Package Desktop App & Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always
