name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build & Release Windows App
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Prepare WebAssembly Assets
        run: npm run copy-wasm

      - name: Build Next.js Standalone
        shell: bash
        env:
          NEXT_PUBLIC_IS_ELECTRON: "true"
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
          SUPABASE_SECRET_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: |
          touch build.log
          if ! npm run build > build.log 2>&1; then
            cat build.log
            exit 1
          fi

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Assemble Standalone Static Assets
        run: node scripts/copy-standalone.cjs

      - name: Compile Electron Main Process
        run: npm run electron:compile

      - name: Package Desktop App
        run: npx electron-builder --publish never

      - name: Upload Windows Release Assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-assets-windows
          path: |
            dist-electron-build/*.exe
            dist-electron-build/*.blockmap
            dist-electron-build/latest*.yml
          if-no-files-found: error

  release-macos:
    name: Build & Release macOS App
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Prepare WebAssembly Assets
        run: npm run copy-wasm

      - name: Build Next.js Standalone
        env:
          NEXT_PUBLIC_IS_ELECTRON: "true"
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_IU"
          SUPABASE_SECRET_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: |
          touch build.log
          if ! npm run build > build.log 2>&1; then
            cat build.log
            exit 1
          fi

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-macos
          path: build.log
          if-no-files-found: ignore

      - name: Assemble Standalone Static Assets
        run: node scripts/copy-standalone.cjs

      - name: Compile Electron Main Process
        run: npm run electron:compile

      - name: Configure macOS Signing
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$MAC_CSC_LINK" ]]; then
            echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

          if [[ -n "$MAC_APPLE_ID" && -n "$MAC_APPLE_APP_SPECIFIC_PASSWORD" && -n "$MAC_APPLE_TEAM_ID" ]]; then
            echo "APPLE_ID=$MAC_APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$MAC_APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$MAC_APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi

      - name: Package Desktop App
        run: npx electron-builder --mac --publish never

      - name: Upload macOS Release Assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-assets-macos
          path: |
            dist-electron-build/*.dmg
            dist-electron-build/*.zip
            dist-electron-build/*.blockmap
            dist-electron-build/latest*.yml
          if-no-files-found: error

  publish-release:
    name: Publish Desktop Release
    needs:
      - release-windows
      - release-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read App Version
        id: app-version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Windows Release Assets
        uses: actions/download-artifact@v4
        with:
          name: desktop-assets-windows
          path: release-assets/windows

      - name: Download macOS Release Assets
        uses: actions/download-artifact@v4
        with:
          name: desktop-assets-macos
          path: release-assets/macos

      - name: Publish Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.app-version.outputs.version }}
        shell: bash
        run: |
          TAG="v$VERSION"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$VERSION" --generate-notes
          fi

          mapfile -d '' ASSETS < <(
            find release-assets -type f \
              \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.blockmap" -o -name "latest*.yml" \) \
              -print0
          )
          if (( ${#ASSETS[@]} == 0 )); then
            echo "No desktop release assets were produced."
            exit 1
          fi

          gh release upload "$TAG" "${ASSETS[@]}" --clobber
